name: Belora API - CI

# Roda em todo push/PR que toque na pasta belora-api, garantindo que a
# suíte de testes (isolamento de tenant, conflito de horário, cancelamento,
# lembretes, etc. - ver Plano de Testes) passe antes de qualquer merge.
on:
  push:
    branches: [main]
    paths:
      - "belora-api/**"
  pull_request:
    paths:
      - "belora-api/**"

defaults:
  run:
    working-directory: belora-api

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: belora
          POSTGRES_PASSWORD: belora
          POSTGRES_DB: belora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U belora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://belora:belora@localhost:5432/belora_test
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      WHATSAPP_PROVIDER: console
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: belora-api/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Rodar migrations no banco de teste
        run: npm run db:migrate

      - name: Rodar suíte de testes
        run: npm test
